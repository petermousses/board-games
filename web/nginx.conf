pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  limit_req_zone $binary_remote_addr zone=game_requests:10m rate=30r/m;
  # Six browsers polling a three-second cadence generate 120 reads/minute behind one NAT.
  # Keep those reads bounded by both their shared source and their bearer-token identity.
  limit_req_zone $binary_remote_addr zone=session_read_source:10m rate=180r/m;
  limit_req_zone $http_authorization zone=session_read_identity:10m rate=60r/m;
  limit_req_status 429;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'" always;

    location = /healthz { return 204; }

    # This exact UUID detail route is GET-only in the API. Its regex location overrides /api/;
    # join, start, and action suffixes stay under the restrictive generic API budget.
    location ~ "^/api/v1/sessions/[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$" {
      limit_req zone=session_read_source burst=30 nodelay;
      limit_req zone=session_read_identity burst=12 nodelay;
      proxy_pass http://board-games-api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=game_requests burst=20 nodelay;
      proxy_pass http://board-games-api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store";
    }
  }
}
