name: ci

on:
#   pull_request:
  push:
    branches: [develop, feature-three-tier-games, feat/threejs-classic-games]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: board_games
          POSTGRES_USER: board_games
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U board_games -d board_games"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://board_games:ci-password@localhost:5432/board_games?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Fetch migration baseline
        run: git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: azure/setup-kubectl@v4
      - name: Check migration integrity
        run: node scripts/check-migration-integrity.mjs --baseline origin/develop
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: kubectl kustomize deploy/k8s > /dev/null
