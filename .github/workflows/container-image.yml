name: Build and publish container images

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version, without the v prefix (for example, 1.2.3)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

concurrency:
  group: container-images-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: board-games-api
            file: Dockerfile.api
          - image: board-games-web
            file: Dockerfile.web
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${REGISTRY}/${OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if this commit is already published
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for tag in "sha-${COMMIT_SHA}" "sha-${COMMIT_SHA:0:7}"; do
            reference="${IMAGE_NAME}:${tag}"
            if output="$(docker manifest inspect "$reference" 2>&1)"; then
              echo "::error::An image already exists for commit ${COMMIT_SHA}: ${reference}"
              exit 1
            fi

            case "$output" in
              *"manifest unknown"*|*"not found"*|*"no such manifest"*)
                ;;
              *)
                echo "::error::Could not verify whether ${reference} exists: ${output}" >&2
                exit 1
                ;;
            esac
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate manual version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version must use MAJOR.MINOR.PATCH format, for example 1.2.3.' >&2
            exit 1
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=sha,prefix=sha-,format=long

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
