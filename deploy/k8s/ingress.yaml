apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: board-games
  labels:
    app.kubernetes.io/name: board-games-web
    app.kubernetes.io/part-of: board-games
spec:
  ingressClassName: traefik
  rules:
    - host: games.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: board-games-web
                port:
                  name: http
