# Copy this outside the repository, replace every value, then apply it before the kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: board-games-secrets
  namespace: board-games
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-a-long-random-password
  DATABASE_URL: postgresql://board_games:replace-with-a-long-random-password@postgres:5432/board_games?sslmode=disable
